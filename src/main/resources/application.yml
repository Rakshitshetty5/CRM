spring:
  application:
    name: flowcrm
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flowcrm}
    username: ${DB_USER:flowcrm_user}
    password: ${DB_PASS:password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret-key: dont-use-in-prod-a9asd7fulasjdfaklsdfu98q3uhjdiosh897as9d8f7ua9osufdjilasdjf

app:
  rate-limit:
    method: fixed
    use-case:
      api-key:
        requests-per-minute: 2
